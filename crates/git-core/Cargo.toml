[package]
name = "git-core"
version = "0.0.1"
description = "ADGitter free open-core: libgit2 wrapper + tagged error taxonomy (Apache-2.0)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
git2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Locates the conventional `~/.ssh/id_*` default key files for the SSH
# credentials fallback in `repo::set_credentials`. Already resolved in
# Cargo.lock (a transitive dep elsewhere in the workspace) — this just makes
# the dependency direct.
dirs = "6"

[dev-dependencies]
tempfile = "3"
